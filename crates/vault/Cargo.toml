[package]
name = "vault"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# XChaCha20-Poly1305：纯 Rust，能编成 WASM。随机数自己用 getrandom 取，不开它的 getrandom 特性
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
zeroize = "1"
# 云同步（src/sync.rs）：同步密码派生用 Argon2id，拆钥匙用 HKDF-SHA256。都是 RustCrypto 纯 Rust 实现，能编成 WASM。
# Argon2 不要默认特性：PHC 字符串和随机盐都用不到，盐自己用 getrandom 取
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13"
# 保险箱条目的摘要用 HMAC-SHA256（hkdf 本来就带着它）
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# 随机数在浏览器里走 crypto.getRandomValues
getrandom = { version = "0.3", features = ["wasm_js"] }
