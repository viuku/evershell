# 产品名 EverShell，应用标识 dev.evershell.desktop（见 tauri.conf.json）。
# 标识决定 Mac 上的数据目录和钥匙串条目，正式发布后不要再改。
[package]
name = "evershell-desktop"
description = "EverShell 桌面端"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "evershell_desktop_lib"
# 以后做 iOS / Android 时再加 staticlib / cdylib
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
ssh-core = { path = "../../../crates/ssh-core" }
vault = { path = "../../../crates/vault" }
tauri = { version = "2.12", features = [] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
# 系统钥匙串，只放保险箱钥匙：macOS Keychain / Windows 凭据管理器 / Linux Secret Service
keyring = "4"
# 上传的远端路径走 HTTP 头，要 percent 编码
percent-encoding = "2"

# 选私钥文件时自己弹系统的选文件框（src/local_file.rs）。Tauri 本来就带着这几个包，版本跟着它走
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
